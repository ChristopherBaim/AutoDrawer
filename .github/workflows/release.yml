name: Build Windows executable

# Builds AutoDrawer.exe on a Windows runner.
#   - Pushing a version tag (e.g. v1.1) builds the exe AND attaches it to the
#     GitHub Release for that tag, so users can download it.
#   - Manual runs (workflow_dispatch) just build the exe and upload it as a
#     temporary Actions artifact, handy for testing a build without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to attach the exe to the Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build AutoDrawer.exe
        run: pyinstaller --onefile --windowed --name AutoDrawer AutoDrawer.py

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDrawer-windows
          path: dist/AutoDrawer.exe

      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoDrawer.exe
